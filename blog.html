---
layout: default
title: Blog
permalink: /blog/
---

<div class="page-header">
  <h1>Blog</h1>
  <p>Thoughts on SAP, tech, and life.</p>
</div>

<!-- Topic Filter -->
<div class="chip-list topic-filter" role="group" aria-label="Filter by topic">
  <button class="chip active" data-topic="all">All</button>
  {% for topic in site.data.topics %}
  <button class="chip" data-topic="{{ topic.slug }}">{{ topic.name }}</button>
  {% endfor %}
</div>

<!-- Posts List -->
<div class="blog-list">
  {% include post-list.html posts=site.posts %}
  <p class="no-results">Nothing here yet. Posts on this topic are coming soon.</p>
</div>

<script>
  (function () {
    var buttons = document.querySelectorAll('.topic-filter .chip');
    var posts = document.querySelectorAll('.blog-list .post-item');
    var empty = document.querySelector('.blog-list .no-results');

    function filterPosts(topic) {
      var shown = 0;
      buttons.forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.topic === topic);
      });
      posts.forEach(function (post) {
        var match = topic === 'all' || post.dataset.topics.split(' ').indexOf(topic) !== -1;
        post.style.display = match ? '' : 'none';
        if (match) shown++;
      });
      empty.style.display = shown === 0 ? 'block' : 'none';

      var url = new URL(window.location);
      if (topic === 'all') url.searchParams.delete('topic');
      else url.searchParams.set('topic', topic);
      history.replaceState(null, '', url);
    }

    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () { filterPosts(btn.dataset.topic); });
    });

    var initial = new URLSearchParams(window.location.search).get('topic');
    var known = Array.prototype.some.call(buttons, function (b) { return b.dataset.topic === initial; });
    filterPosts(known ? initial : 'all');
  })();
</script>
