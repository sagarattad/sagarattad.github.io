# Site Settings
title: "Thoughts, Code & Everything Between"
tagline: "A developer's journey through SAP, tech, and life."
description: "Personal blog of Sagar Attad - SAP Technical Consultant writing about ABAP, RAP, Gen AI, and life."
url: "https://sagarattad.github.io"
baseurl: ""

# Author
author:
  name: "Sagar Attad"
  first_name: "Sagar"
  email: "sagarattad8@gmail.com"
  github: "sagarattad"
  linkedin: ""
  twitter: ""
  bio: "I'm an SAP Technical Consultant with 8.5 years of experience. I explore modern SAP technologies like RAP and Joule, while also diving into Gen AI, building with tools like LangChain, Python, Claude, and OpenAI. I'm also a certified Claude Architect."

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:title/

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# Plugins (GitHub Pages supported)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap